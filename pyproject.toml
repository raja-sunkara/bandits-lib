[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bandits-lib"
version = "0.1.0"
description = "A modular library for bandit algorithms, environments, and problems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
plot = ["matplotlib", "seaborn"]

[tool.ruff]
line-length = 100
